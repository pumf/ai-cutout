name: Build and Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS x64 (Intel) is disabled - ONNX Runtime doesn't provide prebuilt binaries for x86_64-apple-darwin
  # Apple is phasing out Intel Macs, ARM64 is the primary target

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build:renderer
        
      - name: Build Tauri
        run: npm run tauri build
        
      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          tag_name: v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build:renderer
        
      - name: Build Tauri
        run: npm run tauri build
        
      - name: List bundle directory
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle/" -Recurse -File | Select-Object FullName
        
      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          tag_name: v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

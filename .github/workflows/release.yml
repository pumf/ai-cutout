name: Build and Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          
      - name: Download model files
        run: |
          mkdir -p model_files/1.4
          curl -L -o model_files/1.4/model.onnx "https://github.com/pumf/ai-cutout/releases/download/v1.0.0/model-1.4.onnx" || echo "Will use placeholder"
          ls -la model_files/1.4/ || echo "Model directory created"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build:renderer
        
      - name: Build Tauri
        run: npm run tauri build -- --target aarch64-apple-darwin
        
      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          tag_name: v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          
      - name: Download model files
        run: |
          mkdir -p model_files/1.4
          curl -L -o model_files/1.4/model.onnx "https://github.com/pumf/ai-cutout/releases/download/v1.0.0/model-1.4.onnx" || echo "Will use placeholder"
          ls -la model_files/1.4/ || echo "Model directory created"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build:renderer
        
      - name: Build Tauri
        run: npm run tauri build -- --target x86_64-apple-darwin
        
      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          tag_name: v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf curl
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Download model files
        run: |
          mkdir -p model_files/1.4
          curl -L -o model_files/1.4/model.onnx "https://github.com/pumf/ai-cutout/releases/download/v1.0.0/model-1.4.onnx" || echo "Will use placeholder"
          ls -la model_files/1.4/ || echo "Model directory created"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build:renderer
        
      - name: Build Tauri
        run: npm run tauri build
        
      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          tag_name: v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Download model files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path model_files\1.4
          Invoke-WebRequest -Uri "https://github.com/pumf/ai-cutout/releases/download/v1.0.0/model-1.4.onnx" -OutFile "model_files\1.4\model.onnx" -ErrorAction SilentlyContinue
          Get-ChildItem model_files\1.4\ || Write-Host "Model directory created"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build:renderer
        
      - name: Build Tauri
        run: npm run tauri build
        
      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          tag_name: v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

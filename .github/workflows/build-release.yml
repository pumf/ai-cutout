name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.3)'
        required: true
        default: '1.0.3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Python venv
        run: |
          python3 -m venv venv-arm64
          source venv-arm64/bin/activate
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow fastapi uvicorn python-multipart python-json-logger onnxruntime-silicon
          deactivate

      - name: Build DMG
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*.dmg
          if-no-files-found: warn

  build-macos-x64:
    runs-on: macos-12
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Python venv
        run: |
          python3 -m venv venv-x64
          source venv-x64/bin/activate
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow onnxruntime fastapi uvicorn python-multipart python-json-logger
          deactivate

      - name: Build DMG
        run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: release/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Python venv
        shell: cmd
        run: |
          python -m venv venv-x64
          .\venv-x64\Scripts\activate.bat
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow onnxruntime fastapi uvicorn python-multipart python-json-logger

      - name: Build Installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.exe
          if-no-files-found: warn

  release:
    needs: [build-macos-arm64, build-macos-x64, build-windows]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: |
          echo "Artifacts directory structure:"
          ls -R artifacts/ || echo "No artifacts found"
          echo ""
          echo "DMG files:"
          find artifacts/ -name "*.dmg" -type f 2>/dev/null || echo "No DMG files"
          echo ""
          echo "EXE files:"
          find artifacts/ -name "*.exe" -type f 2>/dev/null || echo "No EXE files"

      - name: Get version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Creating release for version: $VERSION"
          # Create release notes file
          cat > release_notes.md << 'EOF'
          ## 小飞AI抠图 v${VERSION}

          ### 更新内容
          - 优化模型列表加载状态显示
          - 修复复制到剪贴板功能
          - 修复导出图片默认文件名
          - 修复缩放比例同步问题
          - 添加跨平台支持（macOS Intel/ARM64、Windows）
          - 改进错误处理和用户提示

          ### 安装包
          | 平台 | 文件 | 说明 |
          |------|------|------|
          | macOS Apple Silicon | 小飞AI抠图-${VERSION}-arm64.dmg | M1/M2/M3 Mac |
          | macOS Intel | 小飞AI抠图-${VERSION}-x64.dmg | Intel Mac |
          | Windows | 小飞AI抠图-Setup-${VERSION}.exe | Windows 10/11 |

          ### 系统要求
          - **macOS**: macOS 11.0 或更高版本
          - **Windows**: Windows 10 或更高版本，需要安装 Python 3.9+

          ### 注意事项
          - macOS 用户可能需要在 系统设置 > 隐私与安全 中允许应用运行
          - Windows 用户请确保已安装 Python 3.9+ 并添加到 PATH
          EOF
          # Create the release
          gh release create "v${VERSION}" \
            --title "小飞AI抠图 v${VERSION}" \
            --notes-file release_notes.md \
            --draft=false \
            --prerelease=false \
            2>/dev/null || echo "Release may already exist, continuing to upload files..."

      - name: Upload DMG files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Uploading DMG files for version: $VERSION"
          for file in $(find artifacts/ -name "*.dmg" -type f 2>/dev/null); do
            echo "Uploading: $file"
            gh release upload "v${VERSION}" "$file" --clobber || echo "Failed to upload $file"
          done

      - name: Upload EXE files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Uploading EXE files for version: $VERSION"
          for file in $(find artifacts/ -name "*.exe" -type f 2>/dev/null); do
            echo "Uploading: $file"
            gh release upload "v${VERSION}" "$file" --clobber || echo "Failed to upload $file"
          done

      - name: Verify Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Release v${VERSION} created successfully!"
          gh release view "v${VERSION}" --json tagName,name,assets || echo "Could not verify release"

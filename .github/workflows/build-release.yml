name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.1.1)'
        required: true
        default: '1.1.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 跨平台共享的最小 Python 依赖
# 后端 torch / safetensors 是可选的 (try/except),1.4 ONNX 模型完全不需要,故全平台都不装
# 减小包体积并避免 torch wheel 在各平台的兼容性问题
env:
  PY_DEPS: numpy pillow onnxruntime fastapi uvicorn python-multipart python-json-logger

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python venv (arm64)
        run: |
          python3 -m venv venv-arm64
          venv-arm64/bin/pip install --upgrade pip
          venv-arm64/bin/pip install $PY_DEPS

      - name: Build (DMG)
        run: |
          ./scripts/prepare-venv-for-arch.sh arm64
          npm run build
          npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*.dmg
          if-no-files-found: warn

  build-macos-x64:
    # 用 ARM runner + Rosetta 跑 x86_64 venv,避免 macos-13 Intel runner 排队卡死
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python venv (x64 via Rosetta)
        # 直接用 Apple 自带 /usr/bin/python3 (universal binary),
        # arch -x86_64 强制走 Rosetta,pip 自动下 x86_64 wheels
        run: |
          arch -x86_64 /usr/bin/python3 -m venv venv-x64
          arch -x86_64 venv-x64/bin/python3 -m pip install --upgrade pip
          arch -x86_64 venv-x64/bin/python3 -m pip install $PY_DEPS
          # 验证 site-packages 中没有 arm64-only .so
          echo "=== 架构核验 ==="
          find venv-x64/lib -name "*.so" -o -name "*.dylib" 2>/dev/null | while read f; do
            file "$f" | grep -oE 'arm64$|x86_64$|universal binary' || true
          done | sort | uniq -c

      - name: Build (DMG)
        run: |
          ./scripts/prepare-venv-for-arch.sh x64
          npm run build
          npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: release/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python venv (Windows x64)
        shell: bash
        run: |
          python -m venv venv-minimal
          venv-minimal/Scripts/python -m pip install --upgrade pip
          venv-minimal/Scripts/python -m pip install $PY_DEPS

      - name: Build (NSIS)
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps for AppImage build
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Setup Python venv (Linux x64)
        run: |
          python3 -m venv venv-minimal
          venv-minimal/bin/pip install --upgrade pip
          venv-minimal/bin/pip install $PY_DEPS

      - name: Build (AppImage)
        run: |
          npm run build
          npx electron-builder --linux AppImage --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release/*.AppImage
          if-no-files-found: warn

  release:
    needs: [build-macos-arm64, build-macos-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: |
          echo "Artifacts directory structure:"
          ls -R artifacts/ || echo "No artifacts found"

      - name: Get version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          cat > release_notes.md << EOF
          ## 小飞AI抠图 v${VERSION}

          ### macOS 用户重要提示 ⚠️

          应用未做 Apple 公证 (Notarization),macOS Sonoma/Sequoia 直接打开会报 "已损坏,无法打开"。
          **这不是真损坏**,只是 Gatekeeper 误报。安装后,在终端执行**一次**:

          \`\`\`bash
          sudo xattr -rd com.apple.quarantine /Applications/小飞AI抠图.app
          \`\`\`

          输入密码后双击应用即可正常打开。

          ### 系统要求
          - **macOS**: macOS 11.0+
          - **Windows**: Windows 10+
          - **Linux**: Ubuntu 20.04+ / Debian 11+ 或同等发行版

          ### 其他注意事项
          - Linux 用户需为 AppImage 添加可执行权限
          EOF
          # 若 release 已存在 gh 会返回非零,允许失败但保留 stderr 让我们看到原因
          if ! gh release create "v${VERSION}" \
            --title "小飞AI抠图 v${VERSION}" \
            --notes-file release_notes.md \
            --draft=false \
            --prerelease=false; then
            echo "::warning::gh release create 失败 (可能 release 已存在),继续 upload"
          fi

      - name: Upload all build artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          # 用 -print0/read 处理含空格/中文的文件名 (Windows .exe 文件名带空格)
          find artifacts/ -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) -print0 \
            | while IFS= read -r -d '' file; do
              echo "Uploading: $file"
              gh release upload "v${VERSION}" "$file" --clobber || echo "::error::Failed to upload $file"
            done

      - name: Verify Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          gh release view "v${VERSION}" --json tagName,name,assets || echo "Could not verify release"
